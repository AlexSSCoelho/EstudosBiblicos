name: Build estudos bíblicos

on:
  push:
    paths:
      - "Pregações/**"
      - "templates/**"
      - "assets/**"
      - "build.py"
      - "server.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/build-estudos.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Gerar e validar HTML, PDF e índice
        run: |
          python build.py
          test -f dist/index.html
          test -f dist/manifest.json
          test "$(find dist/estudos -name '*.html' | wc -l)" -gt 0
          test "$(find dist/estudos -name '*.pdf' | wc -l)" -gt 0
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          cp -a dist/. "$snapshot_dir/"
          python build.py
          diff -r -q "$snapshot_dir" dist

      - name: Validar frontend responsivo e interações
        run: python tests/frontend_qa.py

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: estudos-biblicos-dist
          path: dist/
          if-no-files-found: error

      - name: Empacotar artefato do Pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Persistir artefatos gerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist já está atualizado."
          else
            git commit -m "chore: regenerate study artifacts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
