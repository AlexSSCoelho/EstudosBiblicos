            - rotulo: "Correção da expectativa apressada de alívio imediato"
              termos: ["aflicao", "perseveranca", "apressada", "tempo", "seguir", "ouvir"]
              expressoes: ["expectativa apressada", "nao cessara logo"]
          sinais_erro:
