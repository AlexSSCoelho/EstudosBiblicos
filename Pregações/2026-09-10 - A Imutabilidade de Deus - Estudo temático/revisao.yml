            correta: false
          - texto: "A necessidade de distinguir entre dons materiais dados aos ricos e dons exclusivamente espirituais dados aos pobres."
            correta: false
          - texto: "A explicação detalhada da origem metafísica da queda angélica antes da criação dos luminares do firmamento."
            correta: false
        justificativa: "Além de fiel na aliança (Ml), veraz no juízo (1Sm) e eterno (Sl), Deus é positivamente bom e generoso — incapaz de tentar alguém ao pecado."

      - id: im-s5-f1
