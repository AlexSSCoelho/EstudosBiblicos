            correta: true
          - texto: "Exigir que a pessoa confesse pecado oculto imediatamente com base na severidade da sentença proferida contra Saul."
            correta: false
          - texto: "Recomendar isolamento silencioso até que o sofrido compreenda por si só o sentido oculto de todas as suas perdas."
            correta: false
          - texto: "Substituir qualquer acompanhamento médico ou psicológico pela leitura repetida das promessas feitas a Abraão."
            correta: false
        justificativa: "O Salmo 102 dá linguagem ao lamento sem oferecer explicação causal de cada sofrimento; presença, ajuda prática e cuidado médico ou psicológico são coerentes com a compaixão cristã."

