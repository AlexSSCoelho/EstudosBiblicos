              termos: ["salmo 102", "hebreus 1", "o mesmo", "ho autos", "eco", "citacao", "filho"]
              expressoes: ["tu es o mesmo", "semelhanca verbal"]
            - rotulo: "Aplicação comunitária em Hb 13: líderes passam, doutrinas mudam, Cristo permanece"
              termos: ["dirigentes", "lideres", "doutrinas", "estranhas", "igreja", "ontem", "hoje", "eternamente"]
              expressoes: ["doutrinas estranhas", "comunidade"]
          sinais_erro:
            - ["13.8 e uma citacao literal com formula introdutoria do sl 102", "13.8 nega a eternidade em 1.10"]

  - section_id: o-que-essa-constancia-permite-esperar
    itens:
      - id: im-s7-q1
        tipo: quiz
        dificuldade: facil
        enunciado: "Como a conclusão resume o impacto da imutabilidade divina sobre a prática cristã da oração?"
        alternativas:
          - texto: "Orar não tenta convencer Deus a tornar-se bondoso, mas clama com sinceridade e queixa a quem permanece fiel e pode agir."
            correta: true
          - texto: "Orar torna-se apenas repetição contemplativa de verdades doutrinárias, dispensando pedidos específicos em situações de crise."
            correta: false
          - texto: "Como Deus já decretou o futuro, a oração tem valor apenas psicológico de acalmar os sentimentos de quem sofre."
            correta: false
          - texto: "A oração eficaz depende de evitar qualquer expressão de tristeza ou dúvida diante de perdas físicas graves."
            correta: false
        justificativa: "O salmista lamenta e pede precisamente porque Deus permanece e ouve; o cristão ora apoiado na bondade já revelada e na sabedoria do Senhor."

