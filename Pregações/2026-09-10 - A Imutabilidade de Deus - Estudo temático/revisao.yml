        tipo: quiz
        dificuldade: intermediario
        enunciado: "De que maneira o movimento argumentativo de Tiago 1.13–18 explica a frase 'em quem não há mudança nem sombra de variação'?"
        alternativas:
          - texto: "Opõe o desejo humano que concebe pecado e morte à bondade constante de Deus que somente dá dons perfeitos e gera vida."
            correta: true
          - texto: "Ensina que Deus impede qualquer tipo de provação financeira ou perseguição de alcançar as igrejas da diáspora."
            correta: false
          - texto: "Apresenta um tratado astronômico completo para corrigir erros dos calendários lunares usados nas sinagogas helenistas."
            correta: false
          - texto: "Afirma que o crente regenerado pela palavra da verdade perde a capacidade de experimentar tentações interiores."
            correta: false
        justificativa: "Tiago contrasta a cadeia tentação-desejo-pecado-morte (vv. 13–15) com o Pai das luzes, fonte constante de boas dádivas e do novo nascimento (vv. 17–18)."

      - id: im-s5-q2
        tipo: quiz
        dificuldade: dificil
        enunciado: "Qual aspecto do caráter divino Tiago 1.17–18 acrescenta que não bastaria deduzir apenas da fidelidade pactual ou do juízo?"
