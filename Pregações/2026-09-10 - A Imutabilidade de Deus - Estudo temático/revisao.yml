version: 1

leitura_ativa:
  - target_id: o-deus-que-permanece-e-responde
    perguntas:
      - "Observe qual aparente tensão bíblica abre a investigação e por que os textos são examinados um a um antes da síntese final."
  - target_id: malaquias-316-a-alianca-que-preserva-os-filhos-de-jaco
    perguntas:
      - "Note a ordem do argumento em Malaquias 2.17–3.6: como juízo anunciado e preservação da aliança se articulam em 'Eu, o SENHOR, não mudo'?"
  - target_id: 1-samuel-151035-o-pesar-de-deus-e-a-sentenca-sobre-saul
    perguntas:
      - "Compare 1 Samuel 15.11 com 15.29 e repare no que cada versículo afirma sobre a ação e o caráter de Deus diante do pecado de Saul."
  - target_id: salmo-102128-o-criador-diante-da-transitoriedade-da-criacao
    perguntas:
      - "Observe por que a confissão da eternidade do Criador (v. 12 e vv. 25–27) não silencia o lamento do salmista."
  - target_id: tiago-11218-o-pai-das-luzes-e-a-constancia-da-bondade
    perguntas:
      - "Repare no propósito moral de Tiago 1.17 dentro dos vv. 12–18: a imutabilidade responde a qual suspeita nascida da provação?"
  - target_id: hebreus-61320-e-1379-promessa-juramento-e-o-cristo-que-permanece
    perguntas:
      - "Observe a diferença entre o foco jurídico da âncora em Hebreus 6.13–20 e a consequência comunitária de Hebreus 13.7–9."
  - target_id: o-que-essa-constancia-permite-esperar
    perguntas:
      - "Note quais limites pastorais essa síntese impõe para que a doutrina da imutabilidade não seja reduzida a resposta pronta para o sofrimento."

revisao_secoes:
  - section_id: o-deus-que-permanece-e-responde
    itens:
      - id: im-s1-q1
        tipo: quiz
        dificuldade: facil
        enunciado: "Qual pergunta central conduz o percurso canônico deste estudo temático sobre a imutabilidade de Deus?"
        alternativas:
          - texto: "Como Deus permanece fiel e o mesmo enquanto sente, julga, ouve e responde de maneira real na história?"
            correta: true
          - texto: "Como conciliar a filosofia grega da imobilidade absoluta com os títulos reais de Nabucodonosor e dos profetas?"
            correta: false
          - texto: "Por que o Antigo Testamento descreve um Deus sujeito a mudanças que foi substituído pelo Deus imutável do Novo?"
            correta: false
          - texto: "Em qual ordem cronológica os livros proféticos substituíram o culto do templo pela meditação sobre atributos abstratos?"
            correta: false
        justificativa: "O estudo parte das próprias declarações bíblicas que colocam lado a lado a fidelidade inalterável de Deus e suas ações reais diante da culpa, da oração e da provação."

      - id: im-s1-q2
        tipo: quiz
        dificuldade: dificil
        enunciado: "Por que a introdução reúne Malaquias, 1 Samuel 15, Tiago e Hebreus antes de formular uma definição única?"
        alternativas:
          - texto: "Para mostrar que cada passagem ilumina um ângulo concreto da constância divina a partir de sua própria crise pastoral."
            correta: true
          - texto: "Para provar que apenas as epístolas do Novo Testamento possuem linguagem exata sobre a natureza eterna de Deus."
            correta: false
          - texto: "Para demonstrar que narrativas históricas como 1 Samuel não devem ser usadas na formulação de doutrinas bíblicas."
            correta: false
          - texto: "Para selecionar versículos isolados que confirmem de antemão uma definição filosófica fechada sobre o tempo."
            correta: false
        justificativa: "Em vez de forçar uma abstração fora do texto, o estudo respeita a pergunta específica de cada passagem: aliança, juízo, transitoriedade, bondade nas tentações e promessa firme."

      - id: im-s1-f1
        tipo: flashcard
        dificuldade: intermediario
        frente: "Qual contraste aparente entre declarações bíblicas torna necessário examinar cada passagem em seu contexto?"
        resposta_principal: "Deus declara não mudar (Ml 3.6; Tg 1.17), mas também se entristece (1Sm 15.11), julga, ouve o aflito e responde na história"
        aceitas:
          - "nao muda mas responde na historia"
          - "permanece e age na historia"
          - "nao muda e se entristece"
        parciais:
          - "agir no tempo"
          - "sentimentos de deus"
        nota_explicativa: "O desafio do estudo é compreender o que permanece constante em Deus quando sua ação diante dos seres humanos inclui resposta, pesar, juízo e livramento."

      - id: im-s1-f2
        tipo: flashcard
        dificuldade: facil
        frente: "De acordo com a abertura do estudo, qual é a preocupação específica que leva Tiago a falar da constância sem variação do Pai?"
        resposta_principal: "A suspeita nascida na provação de que Deus seria a origem da tentação ou do mal"
        aceitas:
          - "deus como origem da tentacao"
          - "suspeita de que deus tenta"
          - "bondade nas provacoes"
        parciais:
          - "tentacao"
          - "provacoes"
        nota_explicativa: "Tiago não monta um catálogo metafísico de atributos: defende a bondade constante do Pai das luzes para que o crente provado não atribua a Deus a sedução para o pecado."

      - id: im-s1-a1
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Explique por que afirmar que 'Deus não muda' exige atenção à aliança, ao juízo e à provação, em vez de tratar a imutabilidade como indiferença."
        resposta_modelo: "Nas Escrituras, a constância de Deus não equivale a impassibilidade fria nem a tratar igualmente quem obedece e quem peca; ele julga e sente pesar diante do pecado precisamente porque permanece fiel ao seu caráter santo, à aliança que preservou Israel e à bondade que sustenta os provados."
        trecho_ancora: "Seção 1 — O Deus que permanece e responde"
        rubrica:
          nucleos:
            - rotulo: "Imutabilidade não é indiferença ou insensibilidade às ações humanas"
              termos: ["indiferenca", "responde", "pesar", "juizo", "acoes", "historia", "relaciona"]
              expressoes: ["consequencias reais", "nao e indiferenca"]
            - rotulo: "Raiz na fidelidade ao caráter santo, à aliança e à bondade"
              termos: ["carater", "alianca", "fiel", "fidelidade", "bondade", "promessa"]
              expressoes: ["fiel a alianca", "constancia divina"]
          sinais_erro:
            - ["deus nao tem relacao real com a historia", "deus age sempre igual qualquer que seja a conduta humana"]

      - id: im-s1-a2
        tipo: aberta
        dificuldade: dificil
        enunciado: "Qual método de leitura bíblico-teológica orienta a organização sequencial das cinco grandes passagens do estudo?"
        resposta_modelo: "O estudo segue o método histórico-gramatical submetido ao contexto de cada livro: ouve Malaquias sobre a preservação pactual de Judá, 1 Samuel 15 sobre o pesar e a firmeza da sentença, o Salmo 102 sobre o Criador e o tempo, Tiago 1 sobre a origem da boa dádiva e Hebreus sobre a promessa e Cristo, antes de sintetizar."
        trecho_ancora: "Seção 1 — O Deus que permanece e responde"
        rubrica:
          nucleos:
            - rotulo: "Submissão prévia a cada passagem no seu contexto próprio antes da síntese"
              termos: ["contexto", "passagens", "exegese", "malaquias", "samuel", "salmo", "tiago", "hebreus"]
              expressoes: ["contexto de cada texto", "sintese final"]
            - rotulo: "Articulação progressiva de diferentes perguntas e crises pastorais"
              termos: ["culpa", "sofrimento", "tentacao", "espera", "fidelidade", "perguntas"]
              expressoes: ["culpa sofrimento tentacao", "cada passagem"]
          sinais_erro:
            - ["uso de versiculos isolados fora do contexto", "imposicao de sistema filosofico previo"]

  - section_id: malaquias-316-a-alianca-que-preserva-os-filhos-de-jaco
    itens:
      - id: im-s2-q1
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Qual equívoco acontece quando lemos Malaquias 3.6 ('Eu, o SENHOR, não mudo') isolado de Malaquias 2.17–3.5?"
        alternativas:
          - texto: "Transforma-se em mero conforto genérico o que na verdade é confronto pactual que une juízo purificador e preservação graciosa."
            correta: true
          - texto: "Perde-se a referência cronológica exata ao ano em que o profeta Malaquias reconstruiu os muros ao lado de Neemias."
            correta: false
          - texto: "Deixa-se de perceber que o nome 'filhos de Jacó' refere-se unicamente às dez tribos do norte levadas para a Assíria."
            correta: false
          - texto: "Ignora-se que o verbo hebraico šānâ significa originalmente a troca anual de vestes sacerdotais no templo."
            correta: false
        justificativa: "O povo questionava o juízo de Deus (2.17); Deus responde que virá julgar os próprios ouvintes (3.1–5) e que só não foram consumidos porque Ele é fiel à aliança com Jacó (3.6)."

      - id: im-s2-q2
        tipo: quiz
        dificuldade: dificil
        enunciado: "Por que o profeta chama a geração infiel de 'filhos de Jacó' em Malaquias 3.6?"
        alternativas:
          - texto: "Para lembrar a origem da aliança pela graça antes de qualquer mérito moral, agravando a culpa atual mas impedindo a extinção total."
            correta: true
          - texto: "Para declarar que os descendentes do patriarca possuíam imunidade garantida contra qualquer disciplina divina futura."
            correta: false
          - texto: "Para distinguir os judeus que permaneceram na Babilônia daqueles que retornaram a Jerusalém sob domínio persa."
            correta: false
          - texto: "Para elogiar a perseverança exemplar daquela geração no cumprimento rigoroso dos dízimos e das ofertas puras."
            correta: false
        justificativa: "O título lembra que Jacó foi escolhido antes de poder exibir constância moral; isso agrava a infidelidade dos descendentes, mas explica por que Deus não rompe sua aliança destruindo-os por completo."

      - id: im-s2-f1
        tipo: flashcard
        dificuldade: dificil
        frente: "Qual verbo hebraico é negado por Deus em Malaquias 3.6 ('lōʾ šānîtî' — 'não mudei')?"
        resposta_principal: "שָׁנָה (šānâ — mudar, alterar-se, tornar-se diferente)"
        aceitas:
          - "sana"
          - "shana"
          - "saniti"
          - "shaniti"
          - "lo saniti"
          - "lo shaniti"
          - "mudar"
        parciais:
          - "nao mudo"
          - "alterar"
        nota_explicativa: "Em Malaquias 3.6, Deus vincula sua imutabilidade (lōʾ šānîtî) diretamente ao seu nome pactual YHWH e à preservação dos filhos de Jacó apesar da infidelidade do povo."

      - id: im-s2-f2
        tipo: flashcard
        dificuldade: facil
        frente: "Qual pergunta cética dos ouvintes em Malaquias 2.17 desencadeia o discurso sobre o juízo e a constância de Deus em 3.1–6?"
        resposta_principal: "\"Onde está o Deus do juízo?\""
        aceitas:
          - "onde esta o deus do juizo"
          - "onde esta o deus da justica"
        parciais:
          - "deus do juizo"
          - "por que nao julga"
        nota_explicativa: "Os ouvintes desejavam que Deus punisse os outros, mas o profeta vira o anúncio contra a própria infidelidade cultual e social da comunidade pós-exílica."

      - id: im-s2-a1
        tipo: aberta
        dificuldade: facil
        enunciado: "Explique qual primeiro limite conceitual Malaquias 3.1–6 estabelece para a doutrina da imutabilidade de Deus."
        resposta_modelo: "Constância em Deus não significa tratar toda pessoa sempre do mesmo modo independentemente do pecado, nem conceder licença para a injustiça. Precisamente porque permanece fiel ao seu caráter e à aliança, o Senhor tanto chama o povo ao arrependimento e anuncia juízo contra a opressão quanto preserva o remanescente de Jacó."
        trecho_ancora: "Seção 2 — Malaquias 3.1–6: a aliança que preserva os filhos de Jacó"
        rubrica:
          nucleos:
            - rotulo: "Não significa tratar todos sempre igual nem tolerar pecado impune"
              termos: ["juizo", "arrependimento", "injustica", "pecado", "diferente", "confronto"]
              expressoes: ["nao significa tratar", "chama ao arrependimento"]
            - rotulo: "Une fidelidade pactual (preservação) com santidade justa"
              termos: ["alianca", "fiel", "carater", "preserva", "consumidos", "santo"]
              expressoes: ["fiel a alianca", "nao sois consumidos"]
          sinais_erro:
            - ["o povo tinha merito moral proprio", "deus cancela todo juizo por ser imutavel"]

      - id: im-s2-a2
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Como o 'porque' inicial de Malaquias 3.6 conecta o atributo divino à sobrevivência histórica da comunidade pós-exílica?"
        resposta_modelo: "Em um contexto pós-exílico marcado por ofertas defeituosas, perjúrio e opressão aos vulneráveis, a comunidade mereceria juízo destruidor; o 'porque' demonstra que a sobrevivência contínua dos filhos de Jacó não resulta da fidelidade humana, mas da constância do Senhor em sua promessa de aliança."
        trecho_ancora: "Seção 2 — Malaquias 3.1–6: a aliança que preserva os filhos de Jacó"
        rubrica:
          nucleos:
            - rotulo: "Contraste entre a infidelidade histórica do povo pós-exílico e o juízo merecido"
              termos: ["infidelidade", "ofertas", "culpa", "oprimiam", "consumidos", "merecia"]
              expressoes: ["comunidade culpada", "longe da restauracao"]
            - rotulo: "Causa da preservação reside exclusivamente na fidelidade de YHWH à aliança"
              termos: ["alianca", "sobrevivencia", "senhor", "yhwh", "razao", "promessa"]
              expressoes: ["nao abandonar a alianca", "razao de nao serem consumidos"]
          sinais_erro:
            - ["povo sobreviveu por sua observancia impecavel da lei", "trata-se de garantia de imunidade para pecar"]

  - section_id: 1-samuel-151035-o-pesar-de-deus-e-a-sentenca-sobre-saul
    itens:
      - id: im-s3-q1
        tipo: quiz
        dificuldade: dificil
        enunciado: "Como 1 Samuel 15.11 ('arrependi-me de haver posto a Saul por rei') e 15.29 ('a Força de Israel não mente nem se arrepende') se conciliam no texto?"
        alternativas:
          - texto: "O v. 11 expressa o pesar divino real que altera a condição histórica de Saul, enquanto o v. 29 nega que Deus vacile ou revogue sua sentença como um homem."
            correta: true
          - texto: "O v. 11 pertence a uma tradição popular posterior que foi corrigida teologicamente pelo narrador profético no final do versículo 29."
            correta: false
          - texto: "O v. 29 refere-se exclusivamente à aliança com Davi séculos depois, sem aplicação imediata à decisão definitiva tomada contra Saul."
            correta: false
          - texto: "Ambos os versículos ensinam que Deus desistiu do juízo contra Amaleque depois que Saul ofereceu parte dos rebanhos em sacrifício."
            correta: false
        justificativa: "Os versículos tratam de aspectos distintos e complementares: Deus realmente sente pesar diante da rebelião e retira o reino de Saul, mas sua decisão justa não é volúvel nem negociável."

      - id: im-s3-q2
        tipo: quiz
        dificuldade: facil
        enunciado: "Por que a confissão tardia de Saul ('Pequei', v. 24 e v. 30) não anula a sentença divina comunicada por Samuel?"
        alternativas:
          - texto: "Porque Saul persiste em transferir a culpa e busca preservar sua honra pública diante dos anciãos em vez de submeter-se à palavra divina."
            correta: true
          - texto: "Porque Deus já havia decretado a morte física imediata de Saul antes mesmo da batalha contra os amalequitas."
            correta: false
          - texto: "Porque Samuel agiu movido por ressentimento pessoal pela perda de sua antiga autoridade de juiz sobre todo Israel."
            correta: false
          - texto: "Porque a lei mosaica proibia qualquer forma de perdão real uma vez que o rei tivesse poupado animais estrangeiros."
            correta: false
        justificativa: "Saul culpa o povo e pede para ser honrado diante dos anciãos; a constância justa de Deus não negocia com remorso interesseiro a palavra já sentenciada."

      - id: im-s3-f1
        tipo: flashcard
        dificuldade: intermediario
        frente: "Qual verbo hebraico aparece tanto em 1 Samuel 15.11 quanto em 15.29, cobrindo os sentidos de 'sentir pesar' e 'voltar atrás / mudar de ideia'?"
        resposta_principal: "נָחַם (nāḥam)"
        aceitas:
          - "naham"
          - "nacham"
          - "sentir pesar"
          - "arrepender-se"
        parciais:
          - "pesar"
          - "compadecer"
        nota_explicativa: "O contexto define o matiz de nāḥam: no v. 11 exprime pesar genuíno diante da desobediência de Saul; no v. 29 nega que Deus seja leviano ou mentiroso como mortais que voltam atrás."

      - id: im-s3-f2
        tipo: flashcard
        dificuldade: dificil
        frente: "Qual outra passagem bíblica (além de Jonas 3 e Êxodo 32) o estudo cita para explicitar que anúncios de juízo ou promessa admitem resposta à conversão humana?"
        resposta_principal: "Jeremias 18.7–10 (a palavra sobre nações diante do arrependimento ou da maldade)"
        aceitas:
          - "jeremias 18"
          - "jeremias 18.7-10"
          - "jr 18"
          - "jr 18.7-10"
        parciais:
          - "oleiro"
          - "ninive"
        nota_explicativa: "Em Jeremias 18.7–10, Deus mesmo revela que responder à conversão sincera (como em Nínive) ou à apostasia faz parte coerente do seu governo reto, sem implicar instabilidade moral."

      - id: im-s3-a1
        tipo: aberta
        dificuldade: facil
        enunciado: "Explique por que o estudo rejeita reduzir o pesar de Deus em 1 Samuel 15.11 a um 'mero detalhe de linguagem dispensável'."
        resposta_modelo: "Porque o texto dá uma razão histórica concreta para o pesar divino ('Saul deixou de seguir-me') e liga esse pesar à ação real de retirar-lhe o reino. A resposta divina verdadeira a acontecimentos humanos revela engajamento moral vivo e santo, e não fraqueza ou perda de integridade."
        trecho_ancora: "Seção 3 — 1 Samuel 15.10–35: o pesar de Deus e a sentença sobre Saul"
        rubrica:
          nucleos:
            - rotulo: "Relação causal real com a conduta desobediente de Saul e remoção do reino"
              termos: ["razao", "desobediencia", "reino", "condicao", "real", "acao", "saul"]
              expressoes: ["deixou de segui-lo", "mudanca efetiva"]
            - rotulo: "Resposta verdadeira não implica defeito moral ou mentira"
              termos: ["integridade", "fraqueza", "engajamento", "verdadeira", "carater"]
              expressoes: ["resposta divina verdadeira", "nao equivale a fraqueza"]
          sinais_erro:
            - ["o pesar mostra que deus falhou em prever o erro", "sentir pesar prova que deus mente"]

      - id: im-s3-a2
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Como você contrastaria a ação fiel de Deus para com os 'filhos de Jacó' (Malaquias 3) e para com 'Saul' (1 Samuel 15)?"
        resposta_modelo: "Permanecer fiel ao próprio caráter não obriga Deus a manter o mesmo relacionamento histórico com quem persiste no pecado. Em Judá, a aliança pactual sustenta uma comunidade ainda convocada ao retorno; em Saul, a palavra fiel do Senhor sustenta a sentença de rejeição dinástica contra um rei obstinado em desculpas."
        trecho_ancora: "Seção 3 — 1 Samuel 15.10–35: o pesar de Deus e a sentença sobre Saul"
        rubrica:
          nucleos:
            - rotulo: "Fidelidade não obriga uniformidade de trato independentemente da resposta humana"
              termos: ["mesma", "relacao", "historica", "uniformidade", "pecado", "conduta"]
              expressoes: ["mesma relacao historica", "persiste no pecado"]
            - rotulo: "Contraste entre preservação da aliança em Judá e perda do reino em Saul"
              termos: ["juda", "jaco", "alianca", "saul", "reino", "sentenca", "retira"]
              expressoes: ["retira o reino", "preserva uma comunidade"]
          sinais_erro:
            - ["saul nunca perdeu o reino de fato", "juda foi totalmente exterminada"]

  - section_id: salmo-102128-o-criador-diante-da-transitoriedade-da-criacao
    itens:
      - id: im-s4-q1
        tipo: quiz
        dificuldade: facil
        enunciado: "Qual função exerce o contraste entre a fragilidade do mundo criado e o 'mas tu' (v. 12, v. 27) na oração do Salmo 102?"
        alternativas:
          - texto: "Sustenta a súplica do aflito e garante futuro ao povo de Sião apesar da brevidade e dor da vida humana."
            correta: true
          - texto: "Repreende o orante por lamentar sua doença em vez de silenciar diante da soberania eterna de Deus."
            correta: false
          - texto: "Apresenta uma teoria física antiga sobre o envelhecimento inevitável dos astros e a imortalidade da alma."
            correta: false
          - texto: "Declara que a esperança bíblica exige o abandono definitivo das preces pela restauração terrena de Sião."
            correta: false
        justificativa: "Mesmo diante da criação que envelhece como roupa, a eternidade do Criador ('tu és o mesmo') valida o lamento honesto e fundamenta a esperança para além da vida breve do salmista."

      - id: im-s4-q2
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Como devemos articular a leitura original do Salmo 102 como oração de Israel e sua citação em Hebreus 1.10–12?"
        alternativas:
          - texto: "Ouvir primeiro a dor e esperança israelitas no salmo enriquece a aplicação cristológica feita em Hebreus sem apagá-las."
            correta: true
          - texto: "A citação em Hebreus 1 demonstra que o texto original de Israel não tinha sentido próprio antes da encarnação."
            correta: false
          - texto: "O Salmo 102 tratava originalmente do templo de Salomão e só recebeu sentido eterno na tradução da Septuaginta."
            correta: false
          - texto: "Hebreus 1 aplica os versículos 25–27 apenas à igreja futura, evitando atribuir eternidade direta à pessoa do Filho."
            correta: false
        justificativa: "Respeitar o gênero original de lamento de um aflito preserva a humanidade da oração e torna ainda mais clara a confissão cristológica de Hebreus 1."

      - id: im-s4-f1
        tipo: flashcard
        dificuldade: dificil
        frente: "Qual expressão hebraica no Salmo 102.27 é traduzida como 'Mas tu és o mesmo' e ecoa na cristologia de Hebreus?"
        resposta_principal: "וְאַתָּה הוּא (wə’attâ hû’ — 'mas tu és Ele / o mesmo')"
        aceitas:
          - "weatta hu"
          - "veatta hu"
          - "atta hu"
          - "wə’attâ hû’"
          - "tu es o mesmo"
        parciais:
          - "o mesmo"
          - "tu es"
        nota_explicativa: "Essa cláusula nominal enfática opõe o Criador que não atravessa o tempo ao desgaste dos céus e da terra ('como roupa os mudarás')."

      - id: im-s4-f2
        tipo: flashcard
        dificuldade: intermediario
