      - id: im-s6-a2
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Explique por que Hebreus 1.10–12 (citando o Salmo 102) ilumina a afirmação de Hebreus 13.8 ('Jesus Cristo é o mesmo, ontem, e hoje, e eternamente') sem confundir as duas passagens."
        resposta_modelo: "Em 1.10–12, Hebreus cita explicitamente o 'tu és o mesmo' do Salmo 102 aplicando-o ao Filho soberano sobre a criação passageira; em 13.8 não há citação direta, mas o eco verbal ('o mesmo', ho autós) reforça a consistência de Jesus diante da partida dos líderes e contra ensinos estranhos: os dirigentes passam, mas Cristo e seu evangelho permanecem."
        trecho_ancora: "Seção 6 — Hebreus 6.13–20 e 13.7–9"
