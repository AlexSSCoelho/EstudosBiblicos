  - section_id: hebreus-61320-e-1379-promessa-juramento-e-o-cristo-que-permanece
    itens:
      - id: im-s6-q1
        tipo: quiz
        dificuldade: dificil
        enunciado: "Quais são as 'duas coisas imutáveis' nas quais é impossível que Deus minta em Hebreus 6.18?"
        alternativas:
          - texto: "A promessa feita a Abraão e o juramento por si mesmo com o qual Deus a confirmou aos herdeiros."
            correta: true
          - texto: "As duas tábuas da lei entregues no Sinai e o sacerdócio hereditário da casa de Arão."
            correta: false
          - texto: "A constância física dos céus criados e a sucessão ininterrupta de reis sobre o trono de Judá."
            correta: false
          - texto: "A perseverança interior do próprio crente e a unanimidade doutrinária das lideranças locais."
            correta: false
        justificativa: "Em 6.13–18, Deus somou à sua promessa um juramento em garantia judicial, mostrando aos herdeiros a natureza inalterável (ametáthetos) do seu propósito."

      - id: im-s6-q2
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Como Hebreus 6.13–20 e Hebreus 13.7–9 contribuem de modos distintos para a firmeza de uma comunidade cansada?"
        alternativas:
          - texto: "O capítulo 6 ancora a esperança na promessa jurada e no sacerdócio de Jesus; o capítulo 13 protege contra doutrinas estranhas pela fidelidade a Cristo."
            correta: true
          - texto: "O capítulo 6 dirige-se apenas ao Israel antigo sob Abraão, enquanto o capítulo 13 inaugura regras morais desvinculadas da obra sacerdotal de Cristo."
            correta: false
          - texto: "Ambos os capítulos prometem que toda perseguição e perda de bens cessará imediatamente para quem imitar os antigos dirigentes."
            correta: false
          - texto: "O capítulo 13 apresenta 13.8 como citação direta de Malaquias 3.6 para substituir a autoridade pastoral dos líderes da igreja."
            correta: false
        justificativa: "Hebreus 6 fundamenta a esperança objetiva no acesso aberto por Jesus além do véu; Hebreus 13 aplica a permanência do mesmo Cristo ('ontem, hoje e eternamente') à estabilidade doutrinária da igreja."

