          - "firme"
        nota_explicativa: "No vocabulário jurídico helenístico, ametáthetos designava disposições testamentárias ou decretos que não podem ser alterados nem cancelados posteriormente."

      - id: im-s6-a1
        tipo: aberta
        dificuldade: facil
        enunciado: "O que o exemplo de Abraão em Hebreus 6.12–15 corrige na expectativa de quem confia na promessa imutável de Deus?"
        resposta_modelo: "Abraão recebeu a promessa e o juramento, mas ainda precisou esperar com paciência antes de ver o cumprimento. Portanto, confiar numa palavra inalterável não significa exigir alívio instantâneo das aflições, mas perseverar na fé e na obediência enquanto o tempo da espera perdura."
