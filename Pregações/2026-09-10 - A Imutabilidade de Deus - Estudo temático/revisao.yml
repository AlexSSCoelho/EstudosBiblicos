        resposta_modelo: "Combate a tendência de culpar a Deus pela tentação moral ou imaginar que sua bondade alterna entre luz e trevas durante a provação. A sedução para o pecado nasce da própria cobiça humana (vv. 14–15), ao passo que de Deus procedem unicamente dons bons e perfeitos."
