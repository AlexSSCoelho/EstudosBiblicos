version: 1

leitura_ativa:
  - target_id: a-secao-aramaica-daniel-24b728-e-o-vinculo-entre-os-capitulos-2-e-3
    perguntas:
      - "Observe por que a transição de língua em Daniel 2.4b–7.28 não é acidental e como a estátua de ouro do capítulo 3 responde diretamente ao sonho do capítulo 2."
  - target_id: da-delacao-caldeia-ao-desafio-teologico-de-nabucodonosor-3815
    perguntas:
      - "Note como a acusação dos caldeus (3.12) e a pergunta final de Nabucodonosor (3.15b) deslocam o conflito de um desacordo administrativo para um desafio direto contra Deus."
  - target_id: o-desfecho-na-fornalha-31930-e-a-delimitacao-de-daniel-31618
    perguntas:
      - "Repare nos três movimentos da resposta em 3.16–18 e em como o desfecho dos versículos 19–30 retoma os termos do desafio lançado pelo rei."
  - target_id: a-dispensa-de-apologia-diante-do-absoluto-moral
    perguntas:
      - "Por que os três jovens rejeitam a necessidade de defesa (v. 16) mesmo diante da chance oferecida pelo rei no versículo 15?"
  - target_id: o-poder-de-deus-para-livrar-da-fornalha-e-da-mao-do-rei
    perguntas:
      - "Compare as leituras possíveis de hēn ʾîṯay no versículo 17 e observe o que muda (e o que permanece idêntico) na confissão dos três jovens."
  - target_id: e-se-nao-a-fidelidade-que-nao-impoe-condicoes-a-deus
    perguntas:
      - "Note como o 'E, se não' do versículo 18 retoma em ordem inversa as duas acusações originais e fecha qualquer possibilidade de fé negociada."

revisao_secoes:
  - section_id: babilonia-exilio-e-o-projeto-imperial-de-assimilacao
    itens:
      - id: dn-s1-q1
        tipo: quiz
        dificuldade: facil
        enunciado: "Como funcionava o projeto imperial de Nabucodonosor II ao levar jovens exilados para a corte da Babilônia?"
        alternativas:
          - texto: "Buscava assimilar cultural e religiosamente a elite exilada por meio de instrução, novos nomes e integração administrativa."
            correta: true
          - texto: "Pretendia manter os cativos em isolamento rural absoluto para impedir qualquer contato com a língua ou os cultos caldeus."
            correta: false
          - texto: "Garantia autonomia religiosa integral às províncias desde que os governadores enviassem tributos anuais ao templo de Bel."
            correta: false
          - texto: "Substituía imediatamente toda a burocracia nativa babilônica por jovens estrangeiros recém-chegados das campanhas do Levante."
            correta: false
        justificativa: "Daniel 1 mostra o programa sistemático de assimilação — escrita, língua caldeia, mesa real e mudança de nomes — para converter jovens exilados em servidores integrados ao império."

      - id: dn-s1-q2
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Qual função teológica desempenha o aramaico imperial na seção de Daniel 2.4b–7.28?"
        alternativas:
          - texto: "Sinaliza um ciclo coeso sobre a soberania de Deus acima dos impérios gentílicos, usando a língua da chancelaria internacional."
            correta: true
          - texto: "Indica que os capítulos 2 a 7 foram redigidos apenas para uso privado de sacerdotes judeus depois do retorno de Esdras."
            correta: false
          - texto: "Demonstra que os escribas exilados haviam perdido o domínio do hebraico clássico durante os primeiros anos na corte."
            correta: false
          - texto: "Separa narrativas históricas literais no início do livro de parábolas puramente ficcionais na segunda metade da obra."
            correta: false
        justificativa: "Emoldurada pelo hebraico (1.1–2.4a e caps. 8–12), a seção em aramaico — língua diplomática do Oriente Próximo — endereça o reinado universal de Deus às nações e aos exilados."

      - id: dn-s1-f1
        tipo: flashcard
        dificuldade: dificil
        frente: "Qual palavra aramaica liga a estátua de ouro erguida por Nabucodonosor em Daniel 3 à grande estátua do sonho de Daniel 2?"
        resposta_principal: "ṣəlēm (estátua / imagem)"
        aceitas:
          - "selem"
          - "tselem"
          - "selem estatua"
          - "estatua"
          - "imagem"
        parciais:
          - "ouro"
          - "cabeca de ouro"
        nota_explicativa: "O termo ṣəlēm reaparece conectando 2.31 (a estátua em que só a cabeça era ouro, sucedida por outros reinos) ao monumento totalmente dourado de 3.1, com que o rei desafia o veredito divino."

      - id: dn-s1-f2
        tipo: flashcard
        dificuldade: facil
        frente: "Na estrutura concêntrica (quiasmo) de Daniel 2–7, qual capítulo faz par simétrico direto com Daniel 3?"
        resposta_principal: "Daniel 6 (Daniel na cova dos leões)"
        aceitas:
          - "daniel 6"
          - "cap 6"
          - "capitulo 6"
          - "cova dos leoes"
        parciais:
          - "6"
          - "leoes"
        nota_explicativa: "No arranjo A-B-C-C'-B'-A', Daniel 3 e Daniel 6 formam o par B/B': servos fiéis condenados à morte por recusarem idolatria de Estado e preservados pelo anjo de Deus."

      - id: dn-s1-a1
        tipo: aberta
        dificuldade: dificil
        enunciado: "Explique a ironia teológica entre a estátua sonhada em Daniel 2 e a estátua erguida por Nabucodonosor na campina de Dura em Daniel 3."
        resposta_modelo: "No capítulo 2, Deus revelou que apenas a cabeça da estátua era de ouro e que o império de Nabucodonosor seria sucedido por outros reinos até o Reino eterno de Deus. Em resposta desafiadora, o rei constrói uma imagem inteiramente de ouro e exige adoração unificada para afirmar a perpetuidade de seu próprio império."
        trecho_ancora: "Seção 1.1 — A seção aramaica e o vínculo entre os capítulos 2 e 3"
        rubrica:
          nucleos:
            - rotulo: "Contraste entre a cabeça de ouro (Daniel 2) e a estátua toda de ouro (Daniel 3)"
              termos: ["cabeca", "ouro", "inteira", "toda", "sonho", "sucessao", "reinos", "impérios", "imperios"]
              expressoes: ["inteiramente de ouro", "cabeca de ouro", "reino eterno"]
            - rotulo: "Resposta de autoafirmação ou desafio político-religioso do rei"
              termos: ["desafio", "perpetuidade", "unificacao", "adoracao", "orgulho", "controle", "soberba"]
              expressoes: ["desafia o veredito", "impor fidelidade", "proprio imperio"]
          sinais_erro:
            - ["apenas culto privado", "nada tem relacao com daniel 2"]

      - id: dn-s1-a2
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Por que a posição administrativa de Sadraque, Mesaque e Abednego (Daniel 2.49) explica a gravidade pública da recusa deles em Daniel 3?"
        resposta_modelo: "Eles tinham sido constituídos sobre os negócios da província de Babilônia a pedido de Daniel. Quando o rei convoca todas as autoridades do império para adorar a estátua, a ausência de culto desses altos funcionários judeus quebra a unanimidade exigida na inauguração pública."
        trecho_ancora: "Seção 1.1 — A seção aramaica e o vínculo entre os capítulos 2 e 3"
        rubrica:
          nucleos:
            - rotulo: "Cargo elevado na administração da província"
              termos: ["provincia", "negocios", "autoridades", "cargos", "administracao", "funcionarios", "elite"]
              expressoes: ["negocios da provincia", "altos funcionarios"]
            - rotulo: "Ruptura visível da unanimidade cívico-religiosa imposta pelo decreto"
              termos: ["unanimidade", "convocacao", "decreto", "publica", "recusa", "ausencia", "lealdade"]
              expressoes: ["unanimidade imperial", "adoracao compulsoria"]
          sinais_erro:
            - ["eram escravos comuns sem cargo", "recusaram em segredo"]

  - section_id: o-movimento-de-daniel-3130-da-campina-de-dura-a-fornalha
    itens:
      - id: dn-s2-q1
        tipo: quiz
        dificuldade: dificil
        enunciado: "Qual efeito narrativo o autor busca com as listas repetitivas de cargos e instrumentos musicais em Daniel 3.1–7?"
        alternativas:
          - texto: "Retrata a pomposidade burocrática da corte enquanto expõe com ironia a conformidade automática da elite à ordem do rei."
            correta: true
          - texto: "Fornece um manual litúrgico detalhado para que os exilados judeus reproduzissem a música cerimonial nos templos locais."
            correta: false
          - texto: "Documenta apenas a riqueza arquitetônica da Babilônia sem qualquer relação com o conflito espiritual da narrativa."
            correta: false
          - texto: "Indica que a recusa dos três amigos nasceu primeiro de objeções culturais contra instrumentos musicais estrangeiros."
            correta: false
        justificativa: "A repetição solene das sete categorias de autoridades e da orquestra destaca a engenharia cerimonial do poder e torna mais contrastante a resistência silenciosa dos três judeus."

      - id: dn-s2-q2
        tipo: quiz
        dificuldade: facil
        enunciado: "O que revela a expressão idiomática usada para descrever a acusação dos caldeus em Daniel 3.8 ('acusaram' / comeram os pedaços deles)?"
        alternativas:
          - texto: "Uma denúncia maliciosa e calculada de rivais administrativos que miravam a posição e a fé exclusiva dos judeus."
            correta: true
          - texto: "Um procedimento imparcial de auditoria financeira exigido pelas leis anuais das províncias neobabilônicas."
            correta: false
          - texto: "Um debate filosófico espontâneo entre astrólogos sobre a legitimidade dos sonhos proféticos de Daniel."
            correta: false
          - texto: "Uma tentativa amigável dos conselheiros da corte de poupar os três jovens antes que o decreto entrasse em vigor."
            correta: false
        justificativa: "A expressão ʾăḵalû qarṣêhôn ('comer os pedaços de alguém') expressa calúnia e delação hostil para destruir rivais diante do monarca."

      - id: dn-s2-f1
        tipo: flashcard
        dificuldade: intermediario
        frente: "Qual pergunta de Nabucodonosor no fim de Daniel 3.15 desloca o processo de mera insubordinação civil para confronto teológico aberto?"
        resposta_principal: "\"E quem é o Deus que vos poderá livrar das minhas mãos?\""
        aceitas:
          - "quem e o deus que vos podera livrar das minhas maos"
          - "quem e o deus que vos podera livrar"
          - "quem podera livrar das minhas maos"
        parciais:
          - "quem e o deus"
          - "livrar das minhas maos"
        nota_explicativa: "Assim como Faraó em Êxodo 5.2 e Senaqueribe em 2 Reis 18.35, Nabucodonosor desafia diretamente o poder salvador do Deus de Israel."

      - id: dn-s2-f2
        tipo: flashcard
        dificuldade: dificil
        frente: "No livro de Daniel 3, o que significa a pergunta inicial do rei aos três jovens em 3.14, haṣdāʾ?"
        resposta_principal: "\"É de propósito?\" / \"É verdade?\""
        aceitas:
          - "e de proposito"
          - "e verdade"
          - "proposito"
          - "intencional"
        parciais:
          - "duvida"
          - "interrogatorio"
        nota_explicativa: "Com haṣdāʾ, Nabucodonosor sugere que a recusa poderia ser mal-entendido e oferece nova chance ao som da música — chance que os jovens rejeitam de imediato no v. 16."

      - id: dn-s2-a1
        tipo: aberta
        dificuldade: facil
        enunciado: "Resuma os três movimentos que estruturam a única fala direta de Sadraque, Mesaque e Abednego em Daniel 3.16–18."
        resposta_modelo: "Primeiro (v. 16), dispensam qualquer defesa ou apologia diante do ultimato idólatra; segundo (v. 17), confessam que o Deus a quem servem tem pleno poder para livrá-los da fornalha e da mão do rei; terceiro (v. 18), afirmam que, mesmo sem livramento, jamais servirão aos deuses do rei nem adorarão a estátua."
        trecho_ancora: "Seção 2.2 — O desfecho na fornalha e a delimitação de Daniel 3.16–18"
        rubrica:
          nucleos:
            - rotulo: "Recusa de defesa/apologia (v. 16)"
              termos: ["nao necessitamos", "defesa", "apologia", "responder", "desculpa"]
              expressoes: ["dispensam apologia", "nao precisam responder"]
            - rotulo: "Confissão do poder de Deus para livrar (v. 17)"
              termos: ["poder", "livrar", "fornalha", "mao", "soberano", "deus"]
              expressoes: ["pode livrar", "poder para livrar"]
            - rotulo: "Fidelidade incondicional mesmo sem livramento (v. 18)"
              termos: ["e se nao", "se nao", "serviremos", "adoraremos", "estatua", "incondicional"]
              expressoes: ["mesmo se nao", "nao adoraremos"]
          sinais_erro:
            - ["pedem clemencia ao rei", "prometem negociar o culto"]

      - id: dn-s2-a2
        tipo: aberta
        dificuldade: intermediario
        enunciado: "De que maneira o desfecho na fornalha (Daniel 3.19–30) responde diretamente à pergunta desafiadora de Nabucodonosor no versículo 15?"
        resposta_modelo: "O rei perguntara qual deus poderia livrá-los de suas mãos; diante da recusa, os três entram na fornalha aquecida sete vezes mais, mas o próprio rei testemunha quatro homens soltos andando ilesos no fogo, com o quarto semelhante ao filho dos deuses, reconhecendo enfim que nenhum outro deus pode livrar como este."
        trecho_ancora: "Seção 2.2 — O desfecho na fornalha e a delimitação de Daniel 3.16–18"
        rubrica:
          nucleos:
            - rotulo: "Presença e livramento divino no interior da fornalha"
              termos: ["quarto", "anjo", "soltos", "ilesos", "fogo", "fornalha", "livramento"]
              expressoes: ["quatro homens", "filho dos deuses", "sem dano"]
            - rotulo: "Confissão pública do próprio rei sobre a singularidade de Deus"
              termos: ["reconhece", "testemunha", "nenhum outro", "nabucodonosor", "pode livrar"]
              expressoes: ["ninguem pode livrar", "nao ha outro deus"]
          sinais_erro:
            - ["escaparam antes de entrar no fogo", "soldados salvaram os jovens"]

  - section_id: exegese-de-daniel-31618
    itens:
      - id: dn-s3-q1
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Por que os três jovens iniciam sua resposta em Daniel 3.16 declarando 'Não necessitamos de te responder sobre este negócio'?"
        alternativas:
          - texto: "Porque onde o primeiro mandamento proíbe a idolatria, não há margem para negociação retórica nem necessidade de justificativa adicional."
            correta: true
          - texto: "Porque confiavam em que Daniel chegaria a tempo com uma ordem real revogando a convocação da campina de Dura."
            correta: false
          - texto: "Porque desprezavam a autoridade civil de Nabucodonosor e se recusavam a reconhecer qualquer título oficial do monarca."
            correta: false
          - texto: "Porque o aramaico forense impedia que acusados da província de Babilônia falassem diretamente diante do tribunal imperial."
            correta: false
        justificativa: "Mantendo respeito formal ('ó rei'), eles dispensam a apologia porque não há dúvida sobre a acusação nem espaço moral para adiar a lealdade ao Deus único."

      - id: dn-s3-q2
        tipo: quiz
        dificuldade: dificil
        enunciado: "Qual ponto comum permanece inalterado entre a leitura declarativa ('Eis que o nosso Deus...') e as leituras condicionais de Daniel 3.17?"
        alternativas:
          - texto: "Todas as leituras mantêm a certeza absoluta na capacidade divina de salvar sem transformar o milagre em exigência imposta a Deus."
            correta: true
          - texto: "Todas as leituras defendem que os jovens duvidavam secretamente da existência real de Deus no contexto do exílio babilônico."
            correta: false
          - texto: "Todas as leituras exigem traduzir a partícula hēn como negação enfática da autoridade das leis provinciais babilônicas."
            correta: false
          - texto: "Todas as leituras provam que a expressão veio da Septuaginta e não pertencia originalmente ao texto massorético aramaico."
            correta: false
        justificativa: "Seja hēn traduzido como 'Eis que' (ACF) ou 'Se assim for' (ARA), o v. 17 confessa sem hesitação o poder de Deus para livrar, e o v. 18 subordina a vida deles à liberdade soberana de Deus."

      - id: dn-s3-q3
        tipo: quiz
        dificuldade: facil
        enunciado: "O que evidencia a retomada em ordem inversa das acusações no final de Daniel 3.18 ('não serviremos a teus deuses, nem adoraremos a estátua')?"
        alternativas:
          - texto: "Uma recusa firme, jurídica e solene que devolve ponto por ponto os dois crimes atribuídos pelos caldeus e pelo rei."
            correta: true
          - texto: "Uma tentativa cautelosa de aceitar o culto cívico à estátua real desde que fosse preservado o culto íntimo no lar."
            correta: false
          - texto: "Um equívoco de memória dos réus ao repetirem sob pressão as ordens recebidas pelos arautos da corte."
            correta: false
          - texto: "Uma concessão diplomática temporária para ganhar tempo enquanto se organizava uma rebelião militar na província."
            correta: false
        justificativa: "Retomando a fórmula diplomática de chancelaria ('fica sabendo, ó rei') e os verbos servir e adorar em quiasmo inverso, eles declaram uma recusa pública inequívoca."

      - id: dn-s3-f1
        tipo: flashcard
        dificuldade: facil
        frente: "Qual dupla de ações resume a recusa inegociável de Daniel 3.18 em contraste com o decreto de Nabucodonosor?"
        resposta_principal: "Não servir (pəlaḥ) aos deuses do rei e não se prostrar/adorar (səḡiḏ) à estátua de ouro"
        aceitas:
          - "nao servir e nao adorar"
          - "servir e adorar"
          - "pelah e segid"
          - "pelach e segid"
        parciais:
          - "nao adorar a estatua"
          - "nao servir aos deuses"
        nota_explicativa: "Enquanto o decreto exigia prostrar-se ao som da música, os três jovens qualificam Deus como 'aquele a quem nós servimos (pālḥîn)' e fecham os dois flancos: culto e prostração."

      - id: dn-s3-f2
        tipo: flashcard
        dificuldade: intermediario
        frente: "Qual é o peso da fórmula inicial de Daniel 3.18 wəhēn lāʾ ('E, se não') no conjunto da resposta dos três jovens?"
        resposta_principal: "Marca a fidelidade sem condições mesmo que Deus decida não livrar da fornalha"
        aceitas:
          - "e se nao"
          - "mesmo se nao livrar"
          - "fidelidade sem condicoes"
          - "obediencia incondicional"
        parciais:
          - "nao negociar com deus"
          - "aceitar a morte"
        nota_explicativa: "Sem o v. 18, o v. 17 poderia parecer fé condicionada a um milagre garantido; wəhēn lāʾ distingue confiança no poder de Deus de barganha utilitária."

      - id: dn-s3-f3
        tipo: flashcard
        dificuldade: dificil
        frente: "Que expressão jurídica de chancelaria aramaica abre a sentença solene de Daniel 3.18 ('fica sabendo, ó rei')?"
        resposta_principal: "yəḏîaʿ lehĕwēʾ-lāḵ malkāʾ ('seja conhecido a ti, ó rei')"
        aceitas:
          - "yedia lehewe-lak malka"
          - "yedia lehewe lak malka"
          - "seja conhecido a ti o rei"
          - "fica sabendo o rei"
        parciais:
          - "o rei"
          - "formula diplomatica"
        nota_explicativa: "Os jovens falam sem grosseria nem rebeldia tumultuosa: usam o registro oficial da corte para tornar pública e definitiva a sua posição de consciência."

      - id: dn-s3-a1
        tipo: aberta
        dificuldade: intermediario
        enunciado: "Explique por que Daniel 3.17 precisa ser lido junto com Daniel 3.18 como um único argumento teológico."
        resposta_modelo: "O versículo 17 afirma o poder pleno de Deus para livrar da fornalha e da mão do rei, respondendo ao desafio de 3.15; o versículo 18 acrescenta que, mesmo se Deus decidir não livrá-los temporalmente, a obediência permanece firme. Sem o v. 18, a fé pareceria dependente do milagre; sem o v. 17, pareceria resignação cega diante do império."
        trecho_ancora: "Seção 3.2 e 3.3 — Exegese de Daniel 3.17–18"
        rubrica:
          nucleos:
            - rotulo: "V. 17 afirma a onipotência/capacidade real de Deus para salvar"
              termos: ["poder", "capacidade", "onipotencia", "livrar", "pode", "v. 17", "versiculo 17"]
              expressoes: ["pode livrar", "poder de deus"]
            - rotulo: "V. 18 garante obediência sem impor condições quanto ao desfecho"
              termos: ["v. 18", "versiculo 18", "condicao", "condicoes", "barganha", "mesmo que nao", "liberdade"]
              expressoes: ["nao impoe condicoes", "mesmo sem livramento"]
          sinais_erro:
            - ["v. 18 contradiz o v. 17", "eles perderam a fe no v. 18"]

      - id: dn-s3-a2
        tipo: aberta
        dificuldade: dificil
        enunciado: "Como a primeira leitura (declarativa, ACF) e a segunda leitura (condicional) interpretam o sintagma hēn ʾîṯay em Daniel 3.17, e qual evidência apoia cada uma?"
        resposta_modelo: "A leitura declarativa toma hēn como partícula enfática ('Eis que', ACF/LXX/Vulgata) apoiada na pausa massorética (ʾaṯnāḥ) que separa o poder do livramento futuro; a leitura condicional preserva o sentido habitual de hēn no aramaico ('Se assim for' ou 'Se o nosso Deus existe e pode...'), respondendo diretamente ao ceticismo do rei no v. 15."
        trecho_ancora: "Seção 3.2 — O poder de Deus para livrar da fornalha e da mão do rei"
        rubrica:
          nucleos:
            - rotulo: "Leitura declarativa/asseverativa ('Eis que') com apoio da tradição/acento massorético"
              termos: ["eis que", "declarativa", "asseverativa", "acf", "massoretas", "atnah", "pausa", "vulgata", "septuaginta"]
              expressoes: ["leitura declarativa", "divisao prosodica"]
            - rotulo: "Leitura condicional ('Se') ligada ao uso regular de hēn no aramaico"
              termos: ["condicional", "se", "aramaico", "protase", "ceticismo", "existe"]
              expressoes: ["leitura condicional", "se assim for"]
          sinais_erro:
            - ["o verbo esta errado no original", "significa que deus talvez nao exista"]

      - id: dn-s3-a3
        tipo: aberta
        dificuldade: facil
        enunciado: "Por que a resposta de Daniel 3.16 dispensa 'desculpas' diante da pergunta do rei, apesar de reconhecer a autoridade civil de Nabucodonosor?"
        resposta_modelo: "Porque os três amigos não estavam sob acusação de incompetência administrativa ou conspiração política, mas diante de uma ordem que feria diretamente o primeiro e o segundo mandamentos; diante de um dever absoluto devido a Deus, o tratamento respeitoso ('ó rei') não se traduz em negociação da fé."
        trecho_ancora: "Seção 3.1 — A dispensa de apologia diante do absoluto moral"
        rubrica:
          nucleos:
            - rotulo: "Conflito com mandamento absoluto de adoração exclusiva a Deus"
              termos: ["idolatria", "mandamento", "absoluto", "consciencia", "obediencia", "exclusiva"]
              expressoes: ["absoluto moral", "primeiro mandamento", "adoracao exclusiva"]
            - rotulo: "Distinção entre respeito civil ('ó rei') e submissão religiosa"
              termos: ["respeito", "autoridade", "civil", "negociar", "apologia", "defesa"]
              expressoes: ["nao ha margem", "respeito formal"]
          sinais_erro:
            - ["incitaram rebeliao armada", "negaram toda autoridade humana"]

  - section_id: sintese-teologica-horizonte-canonico-e-implicacoes-pastorais
    itens:
      - id: dn-s4-q1
        tipo: quiz
        dificuldade: dificil
        enunciado: "Como a Epístola aos Hebreus (11.34–35) dialoga com o binômio de Daniel 3.17–18 no catálogo dos heróis da fé?"
        alternativas:
          - texto: "Reúne sob a mesma aprovação divina os que apagaram a força do fogo e outros que recusaram livramento até a morte."
            correta: true
          - texto: "Classifica os que morreram mártires como crentes de fé madura superior à dos que escaparam miraculosamente da fornalha."
            correta: false
          - texto: "Restringe a promessa do livramento do fogo exclusivamente à antiga aliança, encerrando os sinais na era apostólica."
            correta: false
          - texto: "Interpreta o quarto homem da fornalha como metáfora poética dos anjos que protegem o templo de Jerusalém."
            correta: false
        justificativa: "Hebreus 11.34–38 celebra tanto os que 'apagaram a força do fogo' (eco do v. 17) quanto os 'outros' torturados e mortos sem ruptura de fé (eco do v. 18)."

      - id: dn-s4-q2
        tipo: quiz
        dificuldade: intermediario
        enunciado: "Qual distorção pastoral contemporânea é diretamente confrontada quando se preserva o 'E, se não' de Daniel 3.18?"
        alternativas:
          - texto: "A fé utilitária que trata a oração como técnica para exigir imunidade terrena e negocia obediência por livramento."
            correta: true
          - texto: "A disciplina de apresentar súplicas confiantes a Deus por cura física, proteção em viagens e alívio no sofrimento."
            correta: false
          - texto: "O respeito cristão às autoridades legítimas no ambiente de trabalho, nas leis civis e no serviço público."
            correta: false
          - texto: "A esperança escatológica no retorno visível de Cristo para julgar impérios idólatras no fim da história."
            correta: false
        justificativa: "Apagar o v. 18 transforma o v. 17 em garantia automática de bem-estar; mantê-lo preserva a oração confiante sem transformar Deus em meio para interesses próprios."

      - id: dn-s4-f1
        tipo: flashcard
        dificuldade: facil
