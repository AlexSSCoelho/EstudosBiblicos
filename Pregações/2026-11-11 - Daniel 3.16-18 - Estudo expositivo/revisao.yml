          - "alimento"
        nota_explicativa: "A firmeza diante da crise visível na campina de Dura amadureceu antes nas decisões discretas e diárias de fidelidade na corte."

      - id: dn-s4-f2
        tipo: flashcard
        dificuldade: dificil
        frente: "De que maneira a presença do quarto homem na fornalha (Dn 3.25, 28) se relaciona ao horizonte cristológico do Novo Testamento?"
        resposta_principal: "Antecipa o Emanuel — o Deus que entra com o seu povo no fogo da provação em vez de apenas salvá-lo à distância (Mt 28.20)"
        aceitas:
          - "emanuel"
          - "deus conosco"
          - "presenca na provacao"
          - "mateus 28.20"
          - "presenca no fogo"
        parciais:
          - "presenca de cristo"
          - "filho de deus"
        nota_explicativa: "Ecoando Isaías 43.2 ('Quando passares pelo fogo... eu estarei contigo'), o episódio aponta para o Filho que atravessou a cruz e garante presença constante à igreja."

      - id: dn-s4-a1
        tipo: aberta
        dificuldade: facil
        enunciado: "Qual equilíbrio a atitude de Sadraque, Mesaque e Abednego ensina sobre a postura do cristão diante da vocação pública e das autoridades?"
        resposta_modelo: "O cristão atua com competência, integridade e respeito civil às autoridades legítimas (Rm 13; 1Pe 2), evitando tanto a covardia que cede à idolatria corporativa ou ideológica quanto a agressividade tumultuosa; mantém serenidade firme e prefere sofrer perda a violar a consciência diante de Deus."
        trecho_ancora: "Seção 4 — Síntese teológica, horizonte canônico e implicações pastorais"
        rubrica:
          nucleos:
            - rotulo: "Engajamento fiel e respeitoso na vocação pública sem agressividade"
              termos: ["respeito", "integridade", "autoridades", "serenidade", "vocacao", "trabalho", "cidadania"]
              expressoes: ["respeito formal", "autoridades legitimas", "sem agressividade"]
            - rotulo: "Limite claro da consciência diante da idolatria ou injustiça"
              termos: ["idolatria", "consciencia", "covardia", "obediencia", "cristo", "deus"]
              expressoes: ["obedecer a deus", "dobrar a consciencia"]
          sinais_erro:
            - ["fuga total do mundo profissional", "insurreicao armada"]

      - id: dn-s4-a2
