        enunciado: "Como Apocalipse 13–14 retoma a tipologia de Daniel 3 para fortalecer a igreja sob pressão?"
        resposta_modelo: "Apocalipse retoma a imagem erguida para ser adorada sob ameaça de morte (Ap 13.14–15) como eco direto da estátua na campina de Dura, convocando a igreja à perseverança dos santos que guardam os mandamentos de Deus e a fé em Jesus mesmo sob coerção imperial (Ap 14.9–12)."
